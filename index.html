<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exercise 3 – Comparatives</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f6fa;color:#182635;font:16px/1.55 Arial;user-select:none;-webkit-user-select:none}header{background:#1769aa;color:white;text-align:center;padding:20px 12px}h1{font-size:clamp(21px,4vw,29px);margin:0}main{max-width:950px;margin:20px auto;padding:0 12px}.panel{background:white;border-radius:12px;padding:17px;margin-bottom:15px;box-shadow:0 4px 16px #173b5814}#gate{max-width:430px;margin:35px auto;text-align:center}input,textarea{width:100%;padding:12px;border:1px solid #b9c8d6;border-radius:8px;font:inherit;user-select:text;-webkit-user-select:text}textarea{min-height:95px}button{border:0;border-radius:8px;padding:10px 13px;background:#1769aa;color:white;font:inherit;font-weight:bold;cursor:pointer}button:disabled{opacity:.45}.hintbtn{background:#8654a6}.reset{background:#b54742}.check{background:#16804a}.secondary{background:#607487}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.toolbar button{font-size:14px}#nav{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}#nav button{background:#e3edf7;color:#194b72;padding:7px 10px}#nav button.current{background:#1769aa;color:white}#nav button.done{background:#d9f2e3;color:#17653a}.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:#607386;font-size:14px}.original{background:#f0f7ff;border-left:4px solid #3188c7;padding:12px;border-radius:8px;margin:14px 0}.prompt{font-size:19px;font-weight:bold;margin:7px 0}.hintbox,.feedback{padding:12px;border-radius:8px;margin-top:12px;white-space:pre-wrap}.hintbox{background:#fff7d9;border-left:4px solid #e4b52e}.good{background:#e9f7ee;border-left:4px solid #187744}.bad{background:#fff0ef;border-left:4px solid #b42318}.score{font-weight:bold;color:#104c7b}.note{font-size:13px;color:#607386}@media(max-width:600px){.panel{padding:13px}.toolbar button{flex:1}.prompt{font-size:17px}}
</style></head><body><header><h1>Exercise 3 – Comparatives</h1><div>Rewrite the sentences without changing their original meanings</div></header><main>
<section id="gate" class="panel"><h2>Enter password</h2><p>Nhập mật khẩu để bắt đầu.</p><input id="pw" type="password" placeholder="Password"><div class="toolbar" style="justify-content:center"><button onclick="unlock()">Start</button></div><p id="msg" class="note"></p></section>
<div id="app" hidden><section class="panel"><div class="meta"><span>Viết lại câu hoàn chỉnh. Mỗi câu chỉ chấm một lần, trừ khi Reset.</span><span id="score" class="score"></span></div><div id="nav"></div></section><section class="panel" id="work"></section></div></main>
<script>
const qs=[
["Tim is older than Sarah.","Sarah ...",["sarah is younger than tim"],"Sarah is younger than Tim.","Dùng tính từ trái nghĩa: old ↔ young.","“Older than” đổi thành “younger than” khi đảo chủ thể.","Tim lớn tuổi hơn Sarah. → Sarah trẻ hơn Tim."],
["Our house is larger than yours.","Your house ...",["your house is smaller than mine"],"Your house is smaller than mine.","large ↔ small; “mine” = my house.","Đổi tính từ sang nghĩa trái ngược và đổi đại từ sở hữu theo góc nhìn mới.","Nhà chúng tôi lớn hơn nhà bạn. → Nhà bạn nhỏ hơn nhà tôi."],
["Bill is not as tall as David.","Bill ...",["bill is shorter than david"],"Bill is shorter than David.","not as + adjective + as → comparative with opposite adjective.","“Not as tall as David” tương đương “shorter than David”.","Bill không cao bằng David. → Bill thấp hơn David."],
["Jack’s marks are worse than mine.","My marks ...",["my marks are better than jack's","my marks are better than jacks"],"My marks are better than Jack’s.","worse ↔ better; “mine” = my marks.","“Worse” là so sánh hơn của bad; trái nghĩa là “better”.","Điểm của Jack kém hơn điểm của tôi. → Điểm của tôi tốt hơn điểm của Jack."],
["This book is the same price as that one.","That book ...",["that book is as expensive as this one"],"That book is as expensive as this one.","the same price as → as expensive as.","Dùng cấu trúc so sánh bằng “as + adjective + as”.","Cuốn sách này cùng giá với cuốn kia. → Cuốn sách kia đắt ngang bằng cuốn này."],
["Your bike is slower than mine.","My bike ...",["my bike is faster than yours"],"My bike is faster than yours.","slow ↔ fast; “mine” = my bike.","Dùng tính từ trái nghĩa “slow/fast”; đổi “mine” thành “yours”.","Xe đạp của bạn chậm hơn xe tôi. → Xe đạp của tôi nhanh hơn xe bạn."],
["My house is bigger than your house.","Your house ...",["your house is smaller than mine"],"Your house is smaller than mine.","big ↔ small; “mine” = my house.","Đổi “bigger” thành “smaller” và dùng “mine” thay cho “my house”.","Nhà tôi lớn hơn nhà bạn. → Nhà bạn nhỏ hơn nhà tôi."],
["The black car is cheaper than the red car.","The red car ...",["the red car is more expensive than the black car"],"The red car is more expensive than the black car.","cheap ↔ expensive.","Tính từ dài “expensive” dùng “more … than”.","Xe đen rẻ hơn xe đỏ. → Xe đỏ đắt hơn xe đen."],
["This film is more interesting than that one.","That film ...",["that film is more boring than this one"],"That film is more boring than this one.","interesting ↔ boring.","Dùng tính từ trái nghĩa để đảo chiều so sánh.","Phim này thú vị hơn phim kia. → Phim kia nhàm chán hơn phim này."],
["My kitchen is smaller than yours.","Your kitchen ...",["your kitchen is larger than mine","your kitchen is bigger than mine"],"Your kitchen is larger/bigger than mine.","small ↔ large/big.","Đổi “smaller” thành “larger/bigger”; “mine” = my kitchen.","Bếp nhà tôi nhỏ hơn bếp nhà bạn. → Bếp nhà bạn lớn hơn bếp nhà tôi."],
["My mother cannot cook as well as me.","I can ...",["i can cook better than my mother"],"I can cook better than my mother.","cannot … as well as → can … better than.","Dùng trạng từ so sánh hơn “better” để diễn đạt nấu ăn giỏi hơn.","Mẹ tôi không nấu ăn giỏi bằng tôi. → Tôi nấu ăn giỏi hơn mẹ tôi."],
["She has a house which is not as modern as my house.","My house ...",["my house is more modern than hers"],"My house is more modern than hers.","not as modern as → more modern than; “hers” = her house.","“Hers” là đại từ sở hữu thay cho “her house”.","Nhà cô ấy không hiện đại bằng nhà tôi. → Nhà tôi hiện đại hơn nhà cô ấy."],
["The movie was boring. I had thought it was interesting.","The movie ...",["the movie was more boring than i had thought","the movie was more boring than i thought"],"The movie was more boring than I had thought.","Use: more + adjective + than.","Tính từ dài dùng “more boring than”; “had thought” nói về điều đã nghĩ trước đó.","Bộ phim nhàm chán. Tôi đã nghĩ nó thú vị. → Bộ phim nhàm chán hơn tôi đã nghĩ."],
["He cannot play tennis as well as Jack.","Jack can ...",["jack can play tennis better than he","jack can play tennis better than him"],"Jack can play tennis better than he.","cannot … as well as → can … better than.","“Better than him” tự nhiên trong giao tiếp; đáp án bài học có thể dùng “better than he”.","Anh ấy không chơi quần vợt giỏi bằng Jack. → Jack chơi quần vợt giỏi hơn anh ấy."],
["I did not spend as much money as you.","You spent ...",["you spent more money than i"],"You spent more money than I.","not as much money as → more money than.","Với danh từ không đếm được “money”, dùng “more … than”.","Tôi không tiêu nhiều tiền bằng bạn. → Bạn tiêu nhiều tiền hơn tôi."],
["I didn’t think this book is expensive as it is.","This book ...",["this book is more expensive than i thought"],"This book is more expensive than I thought.","Use: more expensive than I thought.","Tính từ dài dùng “more + adjective + than”.","Tôi không nghĩ cuốn sách này đắt như vậy. → Cuốn sách này đắt hơn tôi nghĩ."],
["A city has more interesting activities than the countryside.","The countryside ...",["the countryside has fewer activities than a city"],"The countryside has fewer activities than a city.","more activities ↔ fewer activities.","Với danh từ đếm được số nhiều “activities”, dùng “fewer … than”.","Thành phố có nhiều hoạt động thú vị hơn nông thôn. → Nông thôn có ít hoạt động hơn thành phố."],
["A motorbike goes faster than a bike.","A bike ...",["a bike goes more slowly than a motorbike","a bike goes slower than a motorbike"],"A bike goes more slowly than a motorbike.","faster ↔ more slowly/slower.","“Faster” đổi thành “more slowly” hoặc “slower” khi đảo chiều so sánh.","Xe máy chạy nhanh hơn xe đạp. → Xe đạp chạy chậm hơn xe máy."],
["Life in the city is busier than life in the countryside.","Life in the countryside ...",["life in the countryside is freer than life in the city"],"Life in the countryside is freer than life in the city.","Theo đáp án mẫu trong hình: freer than life in the city.","Lưu ý: “freer” không phải nghĩa trái ngược trực tiếp của “busier”; “less busy” sẽ sát nghĩa hơn nếu cần giữ nghĩa chính xác.","Theo đáp án trong hình: Cuộc sống nông thôn tự do hơn cuộc sống thành phố. Lưu ý câu gốc nói thành phố bận rộn hơn."],
["His uncle works less responsibly than Mr. Nam.","Mr. Nam ...",["mr. nam works more responsibly than his uncle","mr nam works more responsibly than his uncle"],"Mr. Nam works more responsibly than his uncle.","less responsibly ↔ more responsibly.","Trạng từ “responsibly” dùng “more/less” để tạo so sánh hơn.","Chú của anh ấy làm việc kém trách nhiệm hơn ông Nam. → Ông Nam làm việc có trách nhiệm hơn chú của anh ấy."]
];
let cur=0,vals=Array(qs.length).fill(""),done=Array(qs.length).fill(false),hints=Array(qs.length).fill(false);
function unlock(){if(document.getElementById('pw').value==='367'){document.getElementById('gate').hidden=true;document.getElementById('app').hidden=false;render()}else document.getElementById('msg').textContent='Incorrect password. Try again.'}document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function norm(s){return String(s).toLowerCase().replace(/[’‘]/g,"'").replace(/[.,!?;:]/g,'').replace(/\s+/g,' ').trim()}
function ok(i){return qs[i][2].some(a=>norm(a)===norm(vals[i]))}
function render(){document.getElementById('nav').innerHTML=qs.map((q,i)=>`<button class="${i===cur?'current ':''}${done[i]?'done':''}" onclick="go(${i})">${i+1}</button>`).join('');let q=qs[cur];document.getElementById('work').innerHTML=`<div class="meta"><span>Question ${cur+1} of ${qs.length}</span><span>${done[cur]?'Submitted — locked':'One attempt only'}</span></div><div class="original"><div class="note">Original sentence</div><div class="prompt">${esc(q[0])}</div><div class="note">Rewrite beginning with</div><div class="prompt">${esc(q[1])}</div></div><label><b>Your answer</b></label><textarea id="answer" placeholder="Type the complete sentence..." ${done[cur]?'disabled':''}>${esc(vals[cur])}</textarea><div class="toolbar"><button class="hintbtn" onclick="hint()" ${hints[cur]||done[cur]?'disabled':''}>HINT</button><button class="check" onclick="check()" ${done[cur]?'disabled':''}>Check answer</button><button class="reset" onclick="resetOne()">Reset this question</button></div>${hints[cur]?`<div class="hintbox"><b>Hint:</b> ${esc(q[4])}</div>`:''}${done[cur]?`<div class="feedback ${ok(cur)?'good':'bad'}"><b>${ok(cur)?'✓ Correct!':'✗ Compare with the model answer.'}</b><br><b>Đáp án mẫu:</b> ${esc(q[3])}<br><b>Giải thích cấu trúc:</b> ${esc(q[5])}<br><b>Nghĩa tiếng Việt:</b> ${esc(q[6])}</div>`:''}<div class="toolbar"><button class="secondary" onclick="prev()" ${cur===0?'disabled':''}>Previous</button><button onclick="next()" ${cur===qs.length-1?'disabled':''}>Next</button></div><p class="note">Chọn số câu để chuyển nhanh. Reset chỉ xóa câu hiện tại và cập nhật điểm.</p>`;document.getElementById('score').textContent=`Score: ${score()} / ${qs.length}`;let ta=document.getElementById('answer');if(ta&&!done[cur])ta.addEventListener('input',e=>vals[cur]=e.target.value)}
function check(){let v=document.getElementById('answer').value.trim();if(!v){alert('Please type your answer first.');return}vals[cur]=v;done[cur]=true;render()}function hint(){hints[cur]=true;render()}function go(i){cur=i;render()}function prev(){if(cur>0){cur--;render()}}function next(){if(cur<qs.length-1){cur++;render()}}function resetOne(){vals[cur]='';done[cur]=false;hints[cur]=false;render()}function score(){return done.reduce((n,v,i)=>n+(v&&ok(i)?1:0),0)}
document.addEventListener('copy',e=>e.preventDefault());document.addEventListener('cut',e=>e.preventDefault());document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&['c','x','a','s','u'].includes(e.key.toLowerCase()))e.preventDefault()});
</script></body></html>
